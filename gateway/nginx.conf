server {
    listen 80;
    server_name _;

    # Basic gateway health endpoint
    location = /health {
        default_type application/json;
        return 200 '{"status":"healthy","service":"api-gateway"}';
    }

    # Enumeration API under one public roof:
    # /api/enumeration/* -> enumeration-api:8000/*
    location /api/enumeration/ {
        proxy_pass http://enumeration-api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Global Config API under one public roof:
    # /api/config/* -> global-config-api:8001/*
    location /api/config/ {
        proxy_pass http://global-config-api:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Friendly API index
    location = / {
        default_type application/json;
        return 200 '{"message":"Unified API Gateway","routes":["/api/enumeration/*","/api/config/*"],"health":"/health"}';
    }
}

