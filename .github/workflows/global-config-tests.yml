name: Global Config API Tests

on:
  push:
    branches:
      - "**"
    paths:
      - "global-config-api/**"
      - ".github/workflows/global-config-tests.yml"
  pull_request:
    paths:
      - "global-config-api/**"
      - ".github/workflows/global-config-tests.yml"

jobs:
  test-global-config:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: global-config-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: global-config-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Detect tests
        id: detect_tests
        run: |
          if find . -type f \( -name "test_*.py" -o -name "*_test.py" \) | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
            echo "Tests found for global-config-api"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No tests found for global-config-api - skipping pytest"
          fi

      - name: Run tests
        if: steps.detect_tests.outputs.has_tests == 'true'
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q

