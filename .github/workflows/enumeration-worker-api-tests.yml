name: Enumeration Worker API Tests

on:
  push:
    branches:
      - "**"
    paths:
      - "enumeration-worker-api/**"
      - "enumeration-shared/**"
      - ".github/workflows/enumeration-worker-api-tests.yml"
  pull_request:
    paths:
      - "enumeration-worker-api/**"
      - "enumeration-shared/**"
      - ".github/workflows/enumeration-worker-api-tests.yml"

jobs:
  test-enumeration-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: enumeration-worker-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: enumeration-worker-api/requirements.txt

      - name: Install shared packages
        run: |
          python -m pip install --upgrade pip
          pip install -e ../enumeration-shared

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -vv --durations=10 test_job_api.py
