name: Enumeration API Property Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

jobs:
  property-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: enumeration-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: enumeration-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full property test suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -vv --durations=20

