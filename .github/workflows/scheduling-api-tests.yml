name: Scheduling API Tests

on:
  push:
    branches:
      - "**"
    paths:
      - "scheduling-api/**"
      - "scheduling-shared/**"
      - ".github/workflows/scheduling-api-tests.yml"
  pull_request:
    paths:
      - "scheduling-api/**"
      - "scheduling-shared/**"
      - ".github/workflows/scheduling-api-tests.yml"

jobs:
  test-scheduling-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: scheduling-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scheduling-api/requirements.txt

      - name: Install shared packages
        run: |
          python -m pip install --upgrade pip
          pip install -e ../scheduling-shared

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -vv --durations=10 test_scheduling_api.py
