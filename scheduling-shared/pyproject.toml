[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scheduling-shared"
version = "0.1.0"
description = "Shared MongoDB models for scheduling services"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.3",
    "pymongo>=4.6.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scheduling_shared*"]

